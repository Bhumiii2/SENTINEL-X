[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sentinel-x"
version = "0.1.0"
description = "Defensive network intrusion detection, incident correlation, and evidence-backed threat intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SENTINEL-X Contributors" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "polars>=1.8",
  "pyarrow>=17.0",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
ml = ["torch>=2.4", "torchmetrics>=1.4"]
tracking = ["mlflow>=2.16"]
explainability = ["shap>=0.46"]
aws = ["boto3>=1.35"]
streaming = ["boto3>=1.35"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
  "pre-commit>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_x"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
